metricbeat.modules:
  - module: system
    metricsets:
      - cpu
      - diskio
      - memory
      - network
      - filesystem
      - fsstat
      # - process_summary
      # - uptime
    filesystem.ignore_types: [nfs, smbfs, autofs, devtmpfs, devpts, hugetlbfs, tmpfs, sysfs, securityfs, cgroup2, cgroup, pstore, debugfs, configfs, fusectl, proc, fuse.lxcfs, squashfs]
    processes: ['.*']
    processors:
      - drop_event:
            when:
              or:
                - regexp:
                      system.network.name: '^(veth|lo|docker|br-)($|)'
                - regexp:
                      system.filesystem.mount_point: '^/(sys|cgroup|proc|dev|etc|host)($|/)'
                - regexp:
                      system.filesystem.mount_point: '^/hostfs/(sys|cgroup|proc|dev|etc|host)($|/)'
    enabled: true
    period: 5s
    cpu.metrics: [normalized_percentages]
  # Per-container metrics, needed to attribute a node's CPU to individual
  # OpenVidu services (openvidu-server, egress, ingress, caddy, redis...).
  # Host-level `system.cpu` alone cannot tell an SFU-bound node from an
  # egress-bound one, which matters when sizing a deployment or measuring the
  # cost of a recording. Requires /var/run/docker.sock to be mounted (the
  # documented run command already mounts it).
  - module: docker
    metricsets:
      - container
      - cpu
      - memory
      - network
      - diskio
    hosts: ["unix:///var/run/docker.sock"]
    enabled: true
    period: 10s
fields:
    worker_name: ${NODE_TYPE}_${NODE_ID}
    node_role: ${NODE_TYPE}
output:
  elasticsearch:
    hosts: ["${ELASTICSEARCH_HOSTNAME}"]
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
setup.ilm.enabled: false